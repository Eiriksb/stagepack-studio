name: Engine tests

on:
  push:
    branches: [native-rust]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.98.0
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
      - name: Test the GPU-free crates
        run: cargo test -p slides-format -p toolkit -p slides-engine

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.98.0
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
      - name: Test the GPU-free crates
        run: cargo test -p slides-format -p toolkit -p slides-engine
      - name: Build the app
        run: cargo build --release -p stagepack-studio
      - name: Assemble the download
        shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          Copy-Item target/release/stagepack-studio.exe out/
          Copy-Item fixtures/showcase out/showcase -Recurse
      - uses: actions/upload-artifact@v4
        with:
          name: engine-windows
          path: out
