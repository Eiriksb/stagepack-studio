[package]
name = "slides-pptx"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
slides-engine = { path = "../engine" }
toolkit = { path = "../toolkit" }
tiny-skia = "=0.11.4"
url = "=2.5.8"
zip = { version = "=9.5.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
quick-xml = "=0.41.0"
# The tests make their own recordings.
slides-terminal = { path = "../terminal", features = ["make"] }
tempfile = "3"
sha2 = "=0.10.9"
