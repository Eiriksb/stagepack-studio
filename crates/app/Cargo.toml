[package]
name = "stagepack-studio"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "stagepack-studio"
path = "src/main.rs"

[features]
# Lets the tests start a live terminal session without the owner's yes, and say yes for themselves.
test-hooks = []
# The packaged app: it looks for the compiler bundle and the live terminal's helper beside itself only, and ignores STUDIO_BUNDLE and STUDIO_TERMINAL_HELPER.
shipped = []

[dependencies]
base64 = "=0.22.1"
# For the local time zone. Already built for the kit, so it adds nothing.
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
dirs = "=6.0.0"
futures = "0.3"
gpui-kit = { version = "=0.9.0", features = ["gpui-fast"] }
notify = "8"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "=0.10.9"
slides-components = { path = "../components" }
slides-engine = { path = "../engine" }
slides-format = { path = "../format" }
# Reading a 3D model and drawing it off-screen, on a thread of its own.
slides-model = { path = "../model", features = ["draw"] }
slides-pdf = { path = "../pdf" }
slides-pptx = { path = "../pptx" }
slides-video = { path = "../video" }
# Why a terminal recording can't be read, said as its still says it.
slides-terminal = { path = "../terminal" }
# What the app and the live terminal's helper say to each other; with no pseudo-terminal in it.
slides-terminal-helper = { path = "../terminal-helper", default-features = false }
toolkit = { path = "../toolkit" }
unicode-segmentation = "=1.13.3"
# Which characters hide in a command the owner is asked to say yes to.
unicode-properties = { version = "=0.1.3", default-features = false, features = ["general-category"] }

[target.'cfg(windows)'.dependencies]
# A command run from a terminal prints into it, though the shipped program has no console of its own.
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Console"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# The tests of the live terminal start sessions themselves.
stagepack-studio = { path = ".", features = ["test-hooks"] }
gpui-kit = { version = "=0.9.0", features = ["test-support"] }
# The tests make their own videos.
slides-video = { path = "../video", features = ["make"] }
# And their own models, drawn on drawers they can slow down.
slides-model = { path = "../model", features = ["make", "draw", "test-hooks"] }
# And their own terminal recordings.
slides-terminal = { path = "../terminal", features = ["make"] }
image = "0.25"
miniz_oxide = "=0.8.9"
proptest = "=1.12.0"
tempfile = "3"
wat = "=1"
toml = "=0.8.23"
zip = { version = "=9.5.0", default-features = false, features = ["deflate"] }
