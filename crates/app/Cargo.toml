[package]
name = "stagepack-studio"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "stagepack-studio"
path = "src/main.rs"

[dependencies]
gpui-kit = { version = "=0.9.0", features = ["gpui-fast"] }
gpui-webview = { version = "=0.9.0", features = ["gpui-fast"] }
wry = { version = "=0.53.3", package = "lb-wry" }
studio-protocol = { path = "../protocol" }
studio-sidecar = { path = "../sidecar" }
async-channel = "2"
anyhow = "1"

[dev-dependencies]
gpui-kit = { version = "=0.9.0", features = ["test-support"] }
