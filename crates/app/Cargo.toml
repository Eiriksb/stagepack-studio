[package]
name = "stagepack-studio"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "stagepack-studio"
path = "src/main.rs"

[dependencies]
dirs = "=6.0.0"
futures = "0.3"
gpui-kit = { version = "=0.9.0", features = ["gpui-fast"] }
notify = "8"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "=0.10.9"
slides-components = { path = "../components" }
slides-engine = { path = "../engine" }
slides-format = { path = "../format" }
slides-pdf = { path = "../pdf" }
slides-pptx = { path = "../pptx" }
unicode-segmentation = "=1.13.3"

[dev-dependencies]
gpui-kit = { version = "=0.9.0", features = ["test-support"] }
tempfile = "3"
wat = "=1"
toml = "=0.8.23"
zip = { version = "=9.5.0", default-features = false, features = ["deflate"] }
