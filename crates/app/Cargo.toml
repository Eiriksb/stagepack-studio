[package]
name = "stagepack-studio"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "stagepack-studio"
path = "src/main.rs"

[dependencies]
futures = "0.3"
gpui-kit = { version = "=0.9.0", features = ["gpui-fast"] }
notify = "8"
slides-engine = { path = "../engine" }
slides-pdf = { path = "../pdf" }
slides-pptx = { path = "../pptx" }

[dev-dependencies]
gpui-kit = { version = "=0.9.0", features = ["test-support"] }
tempfile = "3"
wat = "=1"
zip = { version = "=9.5.0", default-features = false, features = ["deflate"] }
