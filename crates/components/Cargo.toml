[package]
name = "slides-components"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
# Lets the tests run an add-on under limits of their own, to see it stopped quickly.
test-hooks = []

[dependencies]
addon-abi = { path = "../addon-abi" }
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "=0.10.9"
tempfile = "3"
thiserror = { workspace = true }
toolkit = { path = "../toolkit" }
wasmtime = { version = "=50.0.1", default-features = false, features = ["anyhow", "cranelift", "runtime", "std"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[dev-dependencies]
# The tests of add-ons run them under limits of their own.
slides-components = { path = ".", features = ["test-hooks"] }
wat = "=1"
