[package]
name = "slides-terminal-helper"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "slides_terminal_helper"
path = "src/lib.rs"

[[bin]]
name = "stagepack-terminal"
path = "src/main.rs"
required-features = ["run"]

[features]
# The pseudo-terminal code. The app uses only the wire, with this off, so it never links a pseudo-terminal library.
default = ["run"]
run = ["dep:portable-pty", "dep:libc"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# Pseudo-terminals on Linux, ConPTY on Windows; only this program uses it.
portable-pty = { version = "=0.9.0", optional = true }
[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }
