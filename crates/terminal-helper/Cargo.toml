[package]
name = "slides-terminal-helper"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "slides_terminal_helper"
path = "src/lib.rs"

[[bin]]
name = "stagepack-terminal"
path = "src/main.rs"
required-features = ["run"]

[features]
# The pseudo-terminal code. The app uses only the wire, with this off, so it never links a pseudo-terminal library.
default = ["run"]
run = ["dep:portable-pty", "dep:libc", "dep:windows-sys"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# Pseudo-terminals on Linux, ConPTY on Windows; only this program uses it.
portable-pty = { version = "=0.9.0", optional = true }
[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }
[target.'cfg(windows)'.dependencies]
# A job for each program, so that ending it ends what it started too.
windows-sys = { version = "=0.61.2", optional = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
