[package]
name = "slides-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
slides-components = { path = "../components" }
slides-format = { path = "../format" }
slides-video = { path = "../video" }
# Reading a 3D model's view, and what a still drawn of one is. Never its drawing, which needs a
# graphics library: the app gives the deck what draws.
slides-model = { path = "../model" }
toolkit = { path = "../toolkit" }
tiny-skia = "=0.11.4"
cosmic-text = "=0.19.0"
image = "0.25"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
taffy = "=0.15.0"
resvg = "=0.46.0"
svgtypes = "=0.16.2"
serde_json = { workspace = true }
zip = { version = "=9.5.0", default-features = false, features = ["deflate"] }
unicode-segmentation = "=1.13.3"
# The script type of cosmic-text's fallback lists, at the version it uses.
unicode-script = "=0.5.9"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[dev-dependencies]
# The tests make their own videos.
slides-video = { path = "../video", features = ["make"] }
# The tests make their own models, and draw their stills as the app does.
slides-model = { path = "../model", features = ["make", "draw"] }
proptest = "1"
tempfile = "3"
wat = "=1"
