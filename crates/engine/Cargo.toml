[package]
name = "slides-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
slides-components = { path = "../components" }
slides-format = { path = "../format" }
toolkit = { path = "../toolkit" }
tiny-skia = "=0.11.4"
cosmic-text = "=0.19.0"
image = "0.25"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
taffy = "=0.15.0"
resvg = "=0.46.0"
svgtypes = "=0.16.2"
serde_json = { workspace = true }
zip = { version = "=9.5.0", default-features = false, features = ["deflate"] }
unicode-segmentation = "=1.13.3"

[dev-dependencies]
tempfile = "3"
wat = "=1"
