[workspace]
resolver = "3"
members = ["crates/addon-abi", "crates/app", "crates/components", "crates/engine", "crates/format", "crates/pdf", "crates/pptx", "crates/toolkit", "crates/toolkit-macros", "crates/video", "crates/model", "crates/terminal", "crates/terminal-helper", "crates/xtask"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# The video decoder, its container and its colour conversion, as the video spike used them.
openh264 = "=0.9.10"
mp4 = "=0.14.0"
yuvutils-rs = "=0.8.3"
# A 3D model's description, as the 3D spike used it, without its own file and picture reading.
gltf = { version = "=1.4.1", default-features = false }

# Debug info for GPUI is what makes builds use the most memory.
[profile.dev.package."*"]
debug = false

# Pictures in a model are decoded within the time a model is read in, even in a build for tests.
[profile.dev.package.zune-jpeg]
opt-level = 3

# What is shipped: slower to build, smaller and faster to run.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
