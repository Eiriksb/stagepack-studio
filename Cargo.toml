[workspace]
resolver = "3"
members = ["crates/app", "crates/format", "crates/toolkit", "crates/toolkit-macros"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Debug info for GPUI is what makes builds use the most memory.
[profile.dev.package."*"]
debug = false
