[workspace]
resolver = "3"
members = ["crates/protocol", "crates/sidecar", "crates/app"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Debug info for GPUI and the WebKit bindings is what makes builds use the most memory.
[profile.dev.package."*"]
debug = false
